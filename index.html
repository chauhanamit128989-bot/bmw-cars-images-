        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        /* NAVBAR */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #0a0a0a;
            border-bottom: 1px solid #1e1e1e;
        }

        .navbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            white-space: nowrap;
        }
        .logo span { color: #1c69d4; }

        .search {
            flex: 1;
            min-width: 200px;
            display: flex;
            align-items: center;
            background: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            max-width: 420px;
        }
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 9px 14px;
            color: #fff;
            font-size: 14px;
        }
        .search-input::placeholder { color: #555; }
        .search-icon {
            padding: 9px 14px;
            color: #555;
            cursor: pointer;
        }
        .search-icon:hover { color: #1c69d4; }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }
        .login-btn {
            background: transparent;
            border: 1px solid #333;
            color: #ccc;
            padding: 8px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .login-btn:hover { border-color: #1c69d4; color: #1c69d4; }

        .submit-btn {
            background: #1c69d4;
            border: none;
            color: #fff;
            padding: 8px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .submit-btn:hover { background: #1557b8; }

        /* CATEGORY TABS */
        .tabs {
            display: flex;
            gap: 0;
            padding: 0 24px;
            border-bottom: 1px solid #1e1e1e;
            overflow-x: auto;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #666;
            padding: 13px 22px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tab-btn:hover { color: #ccc; }
        .tab-btn.active {
            color: #fff;
            border-bottom-color: #1c69d4;
        }

        /* HERO SLIDER */
        .hero-section {
            position: relative;
            height: 340px;
            overflow: hidden;
            background: #111;
        }
        .hero-section.hidden { display: none; }

        .slides {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease;
        }
        .slide {
            min-width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            border: 1px solid #333;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }
        .slider-btn:hover { background: #1c69d4; border-color: #1c69d4; }
        .slider-btn.prev { left: 16px; }
        .slider-btn.next { right: 16px; }

        /* PAGE CONTENT */
        .page { display: none; }
        .page.active { display: block; }

        .page-title {
            padding: 28px 24px 12px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .page-title span { color: #1c69d4; }

        /* GRID */
        .content-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 3px;
            padding: 3px;
        }

        .box {
            overflow: hidden;
            aspect-ratio: 16/10;
            background: #111;
            cursor: pointer;
            position: relative;
        }
        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease, opacity 0.3s;
            display: block;
        }
        .box:hover img {
            transform: scale(1.05);
            opacity: 0.85;
        }
        .box .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s;
        }
        .box:hover .overlay {
            background: rgba(0,0,0,0.3);
            opacity: 1;
        }
        .box .overlay i {
            font-size: 28px;
            color: #fff;
        }

        /* FOOTER */
        .footer {
            background: #0d0d0d;
            border-top: 1px solid #1e1e1e;
            padding: 40px 24px 24px;
            margin-top: 40px;
        }
        .footer h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .tagline {
            color: #777;
            font-size: 14px;
            max-width: 480px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .tagline span {
            color: #fff;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }
        .icons {
            display: flex;
            gap: 14px;
            margin-bottom: 24px;
        }
        .icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #161616;
            border: 1px solid #2a2a2a;
            transition: border-color 0.2s;
        }
        .icons a:hover { border-color: #1c69d4; }
        .icons img { width: 20px; height: 20px; object-fit: contain; }
        .copyright {
            color: #444;
            font-size: 13px;
        }
        .copyright a { color: #1c69d4; text-decoration: none; }
        .copyright a:hover { text-decoration: underline; }

        /* LIGHTBOX */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        .lightbox.open { display: flex; }
        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 4px;
        }
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
        }

        @media (max-width: 600px) {
            .hero-section { height: 220px; }
            .page-title { font-size: 20px; }
            .content-section { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        }
    </style>
</head>

        const box = document.createElement('div');
        box.className = 'box';
        box.innerHTML = `<img src="${src}" alt="BMW" loading="lazy" decoding="async">
            <div class="overlay"><i class="fa-solid fa-expand"></i></div>`;
        box.querySelector('img').addEventListener('click', () => openLightbox(src));
        grid.appendChild(box);
    });
}

buildGrid('wallpapers');

// ── Tab Switching ────────────────────────────────────────────
function switchTab(tab, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + tab).classList.add('active');
    btn.classList.add('active');
    document.getElementById('heroSlider').classList.toggle('hidden', tab !== 'wallpapers');
    buildGrid(tab);
    // Filter search if active
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (q) filterGrid(tab, q);
}

// ── Slider ───────────────────────────────────────────────────
let slideIndex = 0;
const total = document.querySelectorAll('.slide').length;

function changeSlide(dir) {
    slideIndex = (slideIndex + dir + total) % total;
    document.getElementById('slideTrack').style.transform = `translateX(-${slideIndex * 100}%)`;
}

setInterval(() => changeSlide(1), 4000);

// ── Lightbox ─────────────────────────────────────────────────
function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(e) {
    if (e.target === document.getElementById('lightbox')) {
        document.getElementById('lightbox').classList.remove('open');
    }
}

// ── Search / Filter ──────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', function() {
    const q = this.value.trim().toLowerCase();
    const activeTab = document.querySelector('.tab-btn.active');
    const tabName = activeTab ? activeTab.textContent.toLowerCase().replace('bmw ','').replace(' ','') : 'wallpapers';
    const key = tabName === 'wallpapers' ? 'wallpapers' : tabName === 'mseries' ? 'mseries' : 'suv';
    filterGrid(key, q);
});

function filterGrid(category, q) {
    const grid = document.getElementById('grid-' + category);
    grid.querySelectorAll('.box').forEach(box => {
        const src = box.querySelector('img').src.toLowerCase();
        box.style.display = (!q || src.includes(q)) ? '' : 'none';
    });
}
</script>
